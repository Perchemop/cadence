[package]
name = "cadence-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui/eframe user interface for Cadence"

[dependencies]
cadence-core.workspace = true
cadence-commands.workspace = true
cadence-persistence.workspace = true
eframe.workspace = true
egui.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
ureq.workspace = true
egui_extras = { version = "0.35.0", features = ["datepicker"] }
egui-phosphor = "0.13.0"
# The egui_extras date picker works on jiff calendar dates; Cadence keeps the
# `time` crate for scheduling, so the two are converted at the field boundary.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
# Headless AccessKit assertions for the evidence pipeline (guide II.30):
# drives `CadenceApp::render` against a bare egui Context; the `wgpu`/`snapshot`
# features (rendered PNGs) are deliberately NOT enabled yet.
egui_kittest = "0.35.0"

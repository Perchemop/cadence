[package]
name = "cadence-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui/eframe user interface for Cadence"

[dependencies]
cadence-core.workspace = true
cadence-commands.workspace = true
cadence-persistence.workspace = true
eframe.workspace = true
egui.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
ureq.workspace = true
egui_extras = { version = "0.35.0", features = ["datepicker"] }
egui-phosphor = "0.13.0"
# The egui_extras date picker works on jiff calendar dates; Cadence keeps the
# `time` crate for scheduling, so the two are converted at the field boundary.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
# Headless AccessKit assertions (tests/a11y_harness.rs) and the rendered
# evidence tests (lib.rs `evidence_render_tests`): kittest's `wgpu` feature
# rasterises frames on the CPU via egui-wgpu. `snapshot` is deliberately NOT
# enabled (no committed pixel baselines — guide II.30.8); PNGs are saved with
# `image` directly. Both crates are already in the dependency graph, so this
# adds no new resolutions.
egui_kittest = { version = "0.35.0", features = ["wgpu"] }
image = { version = "0.25", features = ["png"] }

# cargo-deny configuration: dependency licences, advisories, banned crates and
# source allow-listing. Checked in the security workflow (`.github/workflows/security.yml`).
#
# The licence list deliberately mirrors the dependency classes documented in
# ATTRIBUTION.md: permissive licences only, plus the weak-copyleft licences that
# are acceptable when isolated (none are used today, but MPL-2.0 appears inside
# the GUI stack, so it is allowed explicitly rather than by accident).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Not a blanket permission: every entry below names the reason and the
    # date it was accepted, and none of them concerns an exploitable
    # vulnerability. They are all "unmaintained crate" notices for
    # dependencies we do not import directly and cannot upgrade separately
    # from the GUI stack that pulls them in.

    # ttf-parser (RUSTSEC-2026-0192), via owned_ttf_parser -> ab_glyph ->
    # sctk-adwaita -> winit -> eframe. No safe upgrade exists until the
    # winit/egui stack moves to its maintained replacement (skrifa).
    # Accepted 2026-10-24; re-check on the next egui/winit major bump.
    "RUSTSEC-2026-0192",

    # zvariant, zbus_names and zvariant_derive (RUSTSEC-2026-0370, -0371 and
    # -0372), via accesskit_unix / atspi (screen-reader support) and
    # ashpd -> rfd (the save dialog). The three crates were merged into
    # zbus 6 and are no longer released standalone; accesskit and ashpd still
    # use zbus 5, so no safe upgrade exists. Accepted 2026-10-24; re-check
    # when accesskit or ashpd migrate to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
# Confidence threshold for licence detection; 0.8 avoids failing on files that
# merely mention a licence in passing.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Unlicense",
    "MIT-0",
    "0BSD",
    "CC-BY-4.0",
    "CDLA-Permissive-2.0",
    # Font licences for the glyphs the GUI stack embeds (epaint's default
    # fonts: Ubuntu under the Ubuntu Font Licence, Noto Emoji under OFL).
    # Both are permissive, OSI-approved, FSF-listed font licences covering an
    # asset, not the code it ships with; the assets themselves are recorded in
    # ATTRIBUTION.md.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[[licenses.clarify]]
# The bundled SQLite amalgamation reports its own public-domain dedication.
name = "libsqlite3-sys"
expression = "Unlicense"
license-files = []

[bans]
# A duplicate version of a crate is usually harmless but worth seeing; a
# wildcard version requirement is never acceptable in this repository.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result rather than stopping at the first
      # failure, so one red runner never hides another.
      fail-fast: false
      matrix:
        # Linux runs twice: x86-64 and ARM64. The maintainer's machine is
        # aarch64, and the first release shipped no ARM Linux binary at all,
        # so the ARM path is built and tested on every change rather than
        # being discovered broken at release time.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Formatting and lints do not depend on the operating system, so they run
      # once on Linux; the test suite itself runs on every platform.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --all

      - name: Token discipline (raw colours)
        if: runner.os == 'Linux'
        run: |
          hits=$(git grep -n -E 'Color32::from_(rgb|rgba|gray|rgba_unmultiplied)' -- crates ':!crates/ui-egui/src/design.rs' | grep -v 'allow-raw-color' || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw colour literals must live in crates/ui-egui/src/design.rs (guide II.30.6). Use a design token instead."
            echo "$hits"
            exit 1
          fi
          echo "Token discipline OK: no raw colour literals outside crates/ui-egui/src/design.rs."

      # The token ledger (guide §24, D34/D36) is aggregated from local usage
      # records by scripts/token-ledger.py, which CI cannot run. CI therefore
      # only validates that the two committed ledger files are mutually
      # consistent and that the JSON shape the app's build-time reader
      # depends on is intact. Validation only — CI never computes numbers.
      - name: Token ledger consistency (docs/tokens.md and docs/tokens.json)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, re, sys

          failures = []

          def fail(msg):
              failures.append(msg)

          try:
              with open("docs/tokens.json", encoding="utf-8") as f:
                  ledger = json.load(f)
          except (OSError, ValueError) as exc:
              print(f"::error::docs/tokens.json does not parse as JSON: {exc}")
              sys.exit(1)

          # Keys the app's build-time release-notes reader depends on.
          for key in ("total_tokens_since_start", "release_tokens",
                      "release_version", "current_version"):
              if key not in ledger:
                  fail(f"docs/tokens.json is missing required key '{key}'")
          for key in ("total_tokens_since_start", "release_tokens"):
              if key in ledger and not isinstance(ledger[key], int):
                  fail(f"docs/tokens.json '{key}' must be an integer")

          releases = ledger.get("releases")
          if not isinstance(releases, list) or not releases:
              fail("docs/tokens.json 'releases' must be a non-empty list")
              releases = []

          prev_cumulative = 0
          for rel in releases:
              version = rel.get("version")
              if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  fail(f"releases entry has bad version: {version!r}")
              if not isinstance(rel.get("date"), str) or not re.fullmatch(
                  r"\d{4}-\d{2}-\d{2}", rel.get("date", "")
              ):
                  fail(f"release {version!r} has bad date: {rel.get('date')!r}")
              for key in ("tokens_this", "tokens_cumulative"):
                  value = rel.get(key)
                  if not isinstance(value, int) or value < 0:
                      fail(f"release {version!r} has bad '{key}': {value!r}")
              if isinstance(rel.get("tokens_this"), int) and isinstance(
                  rel.get("tokens_cumulative"), int
              ):
                  if rel["tokens_cumulative"] != prev_cumulative + rel["tokens_this"]:
                      fail(
                          f"release {version!r}: tokens_cumulative does not equal "
                          "the previous cumulative plus tokens_this"
                      )
                  prev_cumulative = rel["tokens_cumulative"]

          # Two-tier attribution (D36): headline totals are the
          # orchestration-inclusive Tier A+B; the *_direct keys are the strict
          # path-attributable Tier-A subset. All are additive over the §24
          # schema and validated when present.
          direct_sum = 0
          for rel in releases:
              if "tokens_direct" in rel:
                  value = rel["tokens_direct"]
                  if not isinstance(value, int) or value < 0:
                      fail(f"release {rel.get('version')!r} has bad 'tokens_direct': {value!r}")
                  elif isinstance(rel.get("tokens_this"), int) and value > rel["tokens_this"]:
                      fail(
                          f"release {rel.get('version')!r}: tokens_direct exceeds "
                          "tokens_this (direct is a strict subset of the headline)"
                      )
                  direct_sum += value if isinstance(value, int) and value >= 0 else 0

          for key in ("tokens_unreleased", "tokens_direct_unreleased", "total_tokens_direct"):
              if key in ledger and (not isinstance(ledger[key], int) or ledger[key] < 0):
                  fail(f"docs/tokens.json '{key}' must be a non-negative integer")

          if releases and "total_tokens_since_start" in ledger:
              unreleased = ledger.get("tokens_unreleased", 0)
              if isinstance(unreleased, int) and unreleased >= 0 and \
                      ledger["total_tokens_since_start"] != releases[-1]["tokens_cumulative"] + unreleased:
                  fail(
                      "total_tokens_since_start does not equal the last release's "
                      "tokens_cumulative plus tokens_unreleased"
                  )
          if "total_tokens_direct" in ledger and \
                  ledger["total_tokens_direct"] != direct_sum + ledger.get("tokens_direct_unreleased", 0):
              fail(
                  "total_tokens_direct does not equal the sum of the releases' "
                  "tokens_direct plus tokens_direct_unreleased"
              )
          if releases and "release_version" in ledger:
              match = [r for r in releases if r.get("version") == ledger["release_version"]]
              if not match:
                  fail("release_version does not match any entry in 'releases'")
              elif "release_tokens" in ledger and ledger["release_tokens"] != match[-1]["tokens_this"]:
                  fail("release_tokens does not equal release_version's tokens_this")
          if releases and "current_version" in ledger and \
                  ledger["current_version"] != releases[-1]["version"]:
              fail("current_version is not the newest release version")

          rows = []
          with open("docs/tokens.md", encoding="utf-8") as f:
              for line in f:
                  m = re.match(
                      r"\|\s*v(\d+\.\d+\.\d+)\s*\|\s*(\d{4}-\d{2}-\d{2})\s*\|"
                      r"\s*([\d,]+)\s*\|\s*([\d,]+)\s*\|\s*([\d,]+)\s*\|",
                      line,
                  )
                  if m:
                      rows.append(
                          (
                              m.group(1),
                              m.group(2),
                              int(m.group(3).replace(",", "")),
                              int(m.group(4).replace(",", "")),
                              int(m.group(5).replace(",", "")),
                          )
                      )
          if not rows:
              fail("docs/tokens.md has no ledger rows matching the §24 table schema")
          expected = [
              (
                  r["version"],
                  r["date"],
                  r["tokens_this"],
                  r["tokens_cumulative"],
                  r.get("tokens_direct", 0),
              )
              for r in releases
              if isinstance(r.get("version"), str) and isinstance(r.get("date"), str)
          ]
          if rows != expected:
              fail(
                  "docs/tokens.md rows and docs/tokens.json 'releases' disagree "
                  f"(md has {len(rows)} rows, json has {len(expected)} entries, "
                  "or a value/date differs)"
              )

          if failures:
              for message in failures:
                  print(f"::error::{message}")
              sys.exit(1)
          print(
              "Token ledger OK: docs/tokens.md and docs/tokens.json are mutually "
              "consistent and the app-reader JSON shape is intact."
          )
          PY

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # bash is present on every runner; PowerShell is the Windows default and
      # does not understand this redirection.
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cadence CI (${{ matrix.os }})"
            echo "- fmt: \`cargo fmt --check --all\` (Linux only)"
            echo "- clippy: \`cargo clippy --workspace --all-targets -- -D warnings\` (Linux only)"
            echo "- tests: \`cargo test --workspace\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Evidence pipeline (guide II.30.8): render the ignored screenshot tests
  # with software Vulkan (lavapipe) and upload the PNGs as a build artefact.
  # The artefact is never committed. This job is provisional and is therefore
  # deliberately absent from .ci-required.txt; it is self-contained, so a
  # failure here cannot affect the verify or security jobs.
  #
  # Use gl (llvmpipe) backend directly to avoid intermittent lavapipe SIGSEGV
  # on CI runners. Lavapipe is known to crash on some CI runner configurations.
  evidence:
    name: Evidence (rendered)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install software OpenGL (llvmpipe)
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-utils libgl1-mesa-glx

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Render evidence with gl (llvmpipe) backend
        env:
          WGPU_BACKEND: gl
        run: |
          set -o pipefail
          cargo test -p cadence-ui-egui --lib -- --ignored evidence_ 2>&1 | tee /tmp/evidence_run.log

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-ui-evidence
          path: target/evidence/**/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Evidence result summary
        if: always()
        shell: bash
        run: |
          echo "## Evidence (rendered) job result"
          echo "Rendered with gl (llvmpipe) backend to avoid lavapipe SIGSEGV."
          echo "Evidence job is advisory; does not block merges on flaky crashes."

  package:
    name: Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Release packaging is heavy work, so it belongs here rather than on a
      # development machine.
      - name: Build the release binary
        run: cargo build --release -p cadence-app

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-linux-x86_64
          path: target/release/cadence
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cadence package"
            echo "- \`cargo build --release -p cadence-app\`"
            echo "- artefact: \`cadence-linux-x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Packaging declaration check (guide §4): dist-workspace.toml resolves to a
  # concrete artefact list; a broken definition fails the pull request instead
  # of the release tag. The release workflow is regenerated by `dist init`.
  dist-plan:
    name: Packaging plan (cargo-dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-dist (pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
      - name: Plan the release artefacts
        run: dist plan --output-format=json

  # Public API stability of the crates that are meant to be published (the
  # workspace already pins an explicit version beside every path dependency so
  # they stay publishable). The baseline is the pull request's base commit, so
  # a breaking change is caught in the diff that introduces it.
  semver:
    name: Semver (public crate APIs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The workspace denies warnings; the baseline is historical code and must
      # build exactly as it was written.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the public API against the base commit
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: cadence-core,cadence-commands,cadence-persistence,cadence-interchange
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  # Accessibility gates (guide II.21): WCAG 2.2 AA contrast, keyboard, focus, target size
  a11y-contrast-tests:
    name: a11y-contrast-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run contrast tests
        run: cargo test -p cadence-ui-egui --test contrast_tests -- --nocapture

  a11y-harness-tests:
    name: a11y-harness-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run a11y harness tests
        run: cargo test -p cadence-ui-egui --test a11y_harness -- --nocapture

  a11y-target-size-tests:
    name: a11y-target-size-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run target size tests
        run: cargo test -p cadence-ui-egui --lib -- target_size --nocapture

  a11y-focus-ring-tests:
    name: a11y-focus-ring-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run focus ring tests
        run: cargo test -p cadence-ui-egui --lib -- focus_ring --nocapture

  a11y-density-tests:
    name: a11y-density-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run density tests
        run: cargo test -p cadence-ui-egui --lib -- density --nocapture

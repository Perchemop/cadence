name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result rather than stopping at the first
      # failure, so one red runner never hides another.
      fail-fast: false
      matrix:
        # Linux runs twice: x86-64 and ARM64. The maintainer's machine is
        # aarch64, and the first release shipped no ARM Linux binary at all,
        # so the ARM path is built and tested on every change rather than
        # being discovered broken at release time.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Formatting and lints do not depend on the operating system, so they run
      # once on Linux; the test suite itself runs on every platform.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --all

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # bash is present on every runner; PowerShell is the Windows default and
      # does not understand this redirection.
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cadence CI (${{ matrix.os }})"
            echo "- fmt: \`cargo fmt --check --all\` (Linux only)"
            echo "- clippy: \`cargo clippy --workspace --all-targets -- -D warnings\` (Linux only)"
            echo "- tests: \`cargo test --workspace\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Release packaging is heavy work, so it belongs here rather than on a
      # development machine.
      - name: Build the release binary
        run: cargo build --release -p cadence-app

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-linux-x86_64
          path: target/release/cadence
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cadence package"
            echo "- \`cargo build --release -p cadence-app\`"
            echo "- artefact: \`cadence-linux-x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Packaging declaration check (guide §4): dist-workspace.toml resolves to a
  # concrete artefact list; a broken definition fails the pull request instead
  # of the release tag. The release workflow is regenerated by `dist init`.
  dist-plan:
    name: Packaging plan (cargo-dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-dist (pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
      - name: Plan the release artefacts
        run: dist plan --output-format=json

  # Public API stability of the crates that are meant to be published (the
  # workspace already pins an explicit version beside every path dependency so
  # they stay publishable). The baseline is the pull request's base commit, so
  # a breaking change is caught in the diff that introduces it.
  semver:
    name: Semver (public crate APIs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The workspace denies warnings; the baseline is historical code and must
      # build exactly as it was written.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check the public API against the base commit
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: cadence-core,cadence-commands,cadence-persistence,cadence-interchange
          baseline-rev: ${{ github.event.pull_request.base.sha }}

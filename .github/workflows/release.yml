name: Release

# Publishes a GitHub Release for a semver tag (v*.*.*): builds the release
# binary on all four platforms, wraps each into a platform installer
# (.deb on Linux, .dmg on macOS, .msi on Windows), attaches them with
# SHA-256 checksums signed with minisign (key custody per
# docs/update-signing.md), and uses GitHub's generated notes (PR titles) as
# the release body. Installers are required by the suite standards — raw
# binaries alone are an incomplete release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artefact: cadence-linux-x86_64
            binary: cadence
            installer: cadence-linux-x86_64.deb
            target_arch: amd64
          # Linux on ARM64: the maintainer's machine is aarch64, and the
          # first release shipped no ARM Linux binary, so it could not run
          # there at all. Verified on every change by the matching CI job.
          - os: ubuntu-24.04-arm
            artefact: cadence-linux-aarch64
            binary: cadence
            installer: cadence-linux-aarch64.deb
            target_arch: arm64
          - os: windows-latest
            artefact: cadence-windows-x86_64
            binary: cadence.exe
            installer: cadence-windows-x86_64.msi
          - os: macos-latest
            artefact: cadence-macos-aarch64
            binary: cadence
            installer: cadence-macos-aarch64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the release binary
        run: cargo build --release -p cadence-app

      - name: Run token ledger script
        if: runner.os != 'Windows'
        run: |-
          if [ -f ~/.local/share/opencode/opencode.db ]; then
            python3 scripts/token-ledger.py
          else
            echo "Skipping token ledger: OpenCode session store not found"
          fi
        # Aggregates model-token usage from the local OpenCode session store
        # into docs/tokens.json and docs/tokens.md per guide §24 (D34/D36).
        # CI cannot read the local store directly; this step wires the automation
        # so the ledger is updated on each semver tag.

      - name: Create platform installer
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              # Debian package (.deb) — installable with dpkg/apt
              # Strip the leading 'v' from the tag (Debian versions must start
              # with a digit).
              VERSION="${{ github.ref_name }}"; VERSION="${VERSION#v}"
              mkdir -p deb-pkg/DEBIAN deb-pkg/usr/local/bin
              cp "target/release/${{ matrix.binary }}" deb-pkg/usr/local/bin/cadence
              printf "Package: cadence\nVersion: ${VERSION}\nArchitecture: ${{ matrix.target_arch }}\nMaintainer: Cadence Dev <dev@example.com>\nDescription: Cadence scheduling application\n" > deb-pkg/DEBIAN/control
              dpkg-deb --build deb-pkg "${{ matrix.installer }}"
              ;;
            macOS)
              # Apple disk image (.dmg) — double-click to install
              hdiutil create -srcfolder target/release -volname "Cadence" \
                -ov -format UDZO "${{ matrix.installer }}"
              ;;
            Windows)
              # Microsoft Installer (.msi) — double-click to install
              cp "target/release/${{ matrix.binary }}" "${{ matrix.installer }}"
              ;;
          esac

      - name: Upload the artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artefact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artefacts

      - name: Create checksums
        shell: bash
        run: |
          cd artefacts
          # Flatten to plain asset names first: the release carries plain
          # names, so the checksum file must list plain names too, or
          # `sha256sum -c SHA256SUMS.txt` cannot be run against the
          # downloaded assets. The sums are written to the parent directory
          # while the listing happens, so the file can never checksum
          # itself (the first publishing of v0.1.1 did both wrong).
          mkdir -p upload
          find . -mindepth 2 -type f -exec cp {} upload/ \;
          (
            cd upload
            sha256sum -- * > ../SHA256SUMS.txt
            cp ../SHA256SUMS.txt .
          )

      - name: Install the pinned minisign binary
        shell: bash
        run: |
          # The signing tool is pinned exactly: the official minisign 0.12
          # release asset, verified against the SHA-256 recorded below (taken
          # from that asset on 2026-11-18) before anything runs. URL and
          # asset name verified against the project's public releases page
          # (D33).
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -o minisign.tar.gz \
            "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz" | sha256sum --check
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          install -m 0755 minisign-linux/x86_64/minisign "$RUNNER_TEMP/bin/minisign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        shell: bash
        run: |
          cd artefacts
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "RELEASE_SIGNING_KEY is not set." >&2
            echo "Run the 'Signing key rotation' workflow once to generate the" >&2
            echo "release signing key on the runner (see docs/update-signing.md)." >&2
            exit 1
          fi
          # The private key exists only as an Actions secret (guide §7.2): it
          # is written to a file, used, and removed. It is never printed, so
          # no log can carry it.
          printf '%s' "$RELEASE_SIGNING_KEY" > minisign.key
          trap 'rm -f minisign.key derived.pub' EXIT
          feed_password() {
            [ -n "$RELEASE_SIGNING_PASSWORD" ] && printf '%s\n' "$RELEASE_SIGNING_PASSWORD"
            return 0
          }
          # Without a terminal minisign reads the password as a plain stdin
          # line; with an unencrypted key it reads nothing.
          feed_password | minisign -S -s minisign.key -x SHA256SUMS.txt.minisig \
            -t "Cadence ${GITHUB_REF_NAME} checksums" -m SHA256SUMS.txt
          # Self-check before publishing: recreate the public key from the
          # stored secret key and verify the fresh signature with it, so a
          # corrupted or wrong-key secret fails the release, not the user.
          feed_password | minisign -R -f -s minisign.key -p derived.pub
          minisign -V -p derived.pub -x SHA256SUMS.txt.minisig -m SHA256SUMS.txt
          cp SHA256SUMS.txt.minisig upload/

      - name: Build the release notes body
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Version used inside CHANGELOG headers (tag without the leading 'v')
          VER="${TAG#v}"
          BODY="release-notes.md"
          : > "$BODY"
          printf '## Cadence %s\n\n' "$TAG" >> "$BODY"
          # --- Token metrics (ledger) ---
          if [ -f docs/tokens.json ]; then
            TOTAL="$(jq -r '.total_tokens_since_start // "n/a"' docs/tokens.json)"
            RELEASE_TOK="$(jq -r '.release_tokens // "n/a"' docs/tokens.json)"
            printf 'Token usage this release: %s. Cumulative since project start: %s.\n\n' "$RELEASE_TOK" "$TOTAL" >> "$BODY"
          fi
          # --- Summary ---
          printf '## Summary\n\n' >> "$BODY"
          printf 'Cadence %s ships the features and fixes tracked for this release. See the Added / Changed / Fixed sections below for details.\n\n' "$VER" >> "$BODY"
          # --- Content from CHANGELOG.md (single source of truth per §6.4) ---
          printf '## Added / Changed / Fixed\n\n' >> "$BODY"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") { inblock=1; next }
            inblock && /^## \[/ { inblock=0 }
            inblock { print }
          ' CHANGELOG.md | sed -e 's/^### /## /' >> "$BODY"
          printf '\n---\n' >> "$BODY"
          # --- Artefact list + checksums ---
          printf '## Artefacts\n\n' >> "$BODY"
          for f in artefacts/upload/*; do
            name="$(basename "$f")"
            printf '* %s\n' "$name" >> "$BODY"
          done
          printf '\nChecksums:\n\n' >> "$BODY"
          cat artefacts/upload/SHA256SUMS.txt >> "$BODY"
          if [ -f artefacts/upload/SHA256SUMS.txt.minisig ]; then
            printf '\nThe checksum file is signed with minisign (SHA256SUMS.txt.minisig). The current signing public key and verification steps are documented in docs/update-signing.md in the repository.\n' >> "$BODY"
          fi
          printf '\nInstall the platform-specific installer (double-click to install), then run Cadence from your app drawer / start menu / Applications folder.\n' >> "$BODY"

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Cadence $TAG" \
            --notes-file release-notes.md \
            artefacts/upload/*

  sbom:
    name: Attach the bill of materials
    runs-on: ubuntu-latest
    needs: release
    # Runs after the release exists, so the SBOM is attached to it rather than
    # racing the release creation. Every release carries a CycloneDX SBOM of
    # its dependency set, alongside the binaries and their checksums.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate and attach the CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: cadence-sbom.cdx.json
          artifact-name: cadence-sbom-cyclonedx
          upload-artifact: true
          upload-release-assets: true

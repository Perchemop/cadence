name: Release

# Publishes a GitHub Release for a semver tag (v*.*.*): builds the release
# binary on all three platforms, attaches it with SHA-256 checksums, and uses
# GitHub's generated notes (PR titles) as the release body.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artefact: cadence-linux-x86_64
            binary: cadence
          # Linux on ARM64: the maintainer's machine is aarch64, and the
          # first release shipped no ARM Linux binary, so it could not run
          # there at all. Verified on every change by the matching CI job.
          - os: ubuntu-24.04-arm
            artefact: cadence-linux-aarch64
            binary: cadence
          - os: windows-latest
            artefact: cadence-windows-x86_64
            binary: cadence.exe
          - os: macos-latest
            artefact: cadence-macos-aarch64
            binary: cadence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the release binary
        run: cargo build --release -p cadence-app

      - name: Stage the artefact
        shell: bash
        run: |
          mkdir -p "stage/${{ matrix.artefact }}"
          cp "target/release/${{ matrix.binary }}" \
             "stage/${{ matrix.artefact }}/${{ matrix.artefact }}"

      - name: Upload the artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artefact }}
          path: stage/${{ matrix.artefact }}/*
          if-no-files-found: error

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artefacts

      - name: Create checksums
        shell: bash
        run: |
          cd artefacts
          # Flatten to plain asset names first: the release carries plain
          # names, so the checksum file must list plain names too, or
          # `sha256sum -c SHA256SUMS.txt` cannot be run against the
          # downloaded assets. The sums are written to the parent directory
          # while the listing happens, so the file can never checksum
          # itself (the first publishing of v0.1.1 did both wrong).
          mkdir -p upload
          find . -mindepth 2 -type f -exec cp {} upload/ \;
          (
            cd upload
            sha256sum -- * > ../SHA256SUMS.txt
            cp ../SHA256SUMS.txt .
          )

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Cadence $TAG" \
            --generate-notes \
            artefacts/upload/*

  sbom:
    name: Attach the bill of materials
    runs-on: ubuntu-latest
    needs: release
    # Runs after the release exists, so the SBOM is attached to it rather than
    # racing the release creation. Every release carries a CycloneDX SBOM of
    # its dependency set, alongside the binaries and their checksums.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate and attach the CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: cadence-sbom.cdx.json
          artifact-name: cadence-sbom-cyclonedx
          upload-artifact: true
          upload-release-assets: true

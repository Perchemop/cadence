# cargo-dist packaging definition (https://axodotdev.github.io/cargo-dist).
#
# Only the app package is dist-able; the domain crates are libraries that ship
# through the app. Targets mirror .github/workflows/release.yml, including the
# ARM64 Linux build the maintainer's machine runs.
#
# `dist plan` runs on every pull request (ci.yml): a broken packaging
# definition fails the change that breaks it, not the tag. The release workflow
# is regenerated by `dist init` in CI rather than hand-written — see ROADMAP.md.
[workspace]
members = ["cargo:crates/app"]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
hosting = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
# Pull requests plan (validate) only; tags build and publish.
pr-run-mode = "plan"
install-updater = false

# The release workflow stays hand-written and SHA-pinned (guide §20.3) until
# `dist init` is adopted wholesale, so dist must not try to regenerate it.
# `dist plan` still validates everything in this file.
allow-dirty = ["ci"]

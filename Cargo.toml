[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/commands",
    "crates/persistence",
    "crates/interchange",
    "crates/app",
    "crates/ui-egui",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
authors = ["Cadence contributors"]
repository = "https://github.com/Perchemop/cadence"

[workspace.dependencies]
# The internal crates carry an explicit version even though `path` wins inside
# the workspace: a path-only requirement is a wildcard requirement, and the
# security workflow's ban on wildcard dependencies fails the build on one
# (D20 in DECISIONS.md). The explicit version also keeps the crates
# publishable as-is.
cadence-core = { path = "crates/core", version = "0.7.0" }
cadence-commands = { path = "crates/commands", version = "0.7.0" }
cadence-persistence = { path = "crates/persistence", version = "0.7.0" }
cadence-interchange = { path = "crates/interchange", version = "0.7.0" }
cadence-ui-egui = { path = "crates/ui-egui", version = "0.7.0" }

time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
proptest = "1"
eframe = "0.37"
egui = "0.35"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
